<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .profile {
            text-align: center;
            margin-top: 50px;
        }

        .boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .box {
            width: 200px;
            height: 150px;
            background-color: white;
            border: 2px solid black;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>Rohan Shinde</h1>
        <p>IT Engineering Student</p>

        <div class="boxes">

            <div class="box">
                <h2>About Me</h2>
                <p>I am an IT Engineering student.</p>
            </div>

            <div class="box">
                <h2>Skills</h2>
                <p>HTML, CSS, C++, JavaScript</p>
            </div>

            <div class="box">
                <h2>Hobbies</h2>
                <p>Drawing and Kabaddi</p>
            </div>

        </div>

    </div>

</body>
</html>
